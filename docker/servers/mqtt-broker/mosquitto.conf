log_type subscribe
log_type unsubscribe
log_type websockets
log_type error
log_type warning
log_type notice
log_type information
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Campanha benigna (B8): usuario autenticado para sessoes benignas concluidas.
# allow_anonymous false preserva o comportamento original (anonimo rejeitado);
# o password_file adiciona o usuario benigno usado pelo client-super.
allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets